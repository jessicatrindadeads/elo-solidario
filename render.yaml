services:
  - type: web
    name: elo-solidario-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start:production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: FRONTEND_URL
        value: https://elo-solidario.vercel.app
